spring.application.name=workforce-management

server.port=8082

spring.datasource.url=${DB_URL:jdbc:mysql://mysql-container:3306/workforce_db}
spring.datasource.username=${DB_USERNAME:root}
# IMPORTANT: Override DB_PASSWORD via environment variable in production.
# The default below is development-only and must be changed via .env / env var.
spring.datasource.password=${DB_PASSWORD:change-me-dev-password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# IMPORTANT: Override JWT_SECRET via environment variable in production.
# Default is development-only (see .env.example). Use a long random secret in prod.
jwt.secret=${JWT_SECRET:dev-only-please-override-in-production-use-long-random-secret-min-32-chars}
jwt.expiration=${JWT_EXPIRATION:86400000}

logging.level.com.demo=INFO
logging.level.org.springframework.security=WARN

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.h2-console.enabled=false
