spring.application.name=workforce-management

server.port=8082

spring.datasource.url=${DB_URL:jdbc:mysql://mysql-container:3306/workforce_db}
spring.datasource.username=${DB_USERNAME:root}
# Development-only default; override via DB_PASSWORD env var in production (see .env.example)
spring.datasource.password=${DB_PASSWORD:change-me}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Development-only default; override via JWT_SECRET env var in production (see .env.example)
jwt.secret=${JWT_SECRET:dev-only-change-me}
jwt.expiration=${JWT_EXPIRATION:86400000}

logging.level.com.demo=INFO
logging.level.org.springframework.security=WARN

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.h2-console.enabled=false
