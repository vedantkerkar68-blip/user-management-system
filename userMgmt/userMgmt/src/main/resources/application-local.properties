spring.application.name=workforce-management

server.port=8082

# H2 File-Based Database for Local Development (persists across restarts)
spring.datasource.url=jdbc:h2:file:./data/workforce_db;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.h2-console.enabled=true
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Development-only JWT secret - override via JWT_SECRET env var for any non-local usage
jwt.secret=${JWT_SECRET:dev-only-please-override-in-production-use-long-random-secret-min-32-chars}
jwt.expiration=${JWT_EXPIRATION:86400000}

logging.level.com.demo=DEBUG
logging.level.org.springframework.security=DEBUG
